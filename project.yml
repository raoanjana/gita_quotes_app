name: GitaQuotes
options:
  bundleIdPrefix: com.anjanarao.hinduwisdom
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your Apple ID team in Xcode > Signing & Capabilities
    CODE_SIGN_STYLE: Automatic

targets:
  GitaQuotes:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anjanarao.hinduwisdom
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hindu Wisdom
        AnalyticsEndpoint: "https://apq2eytk3e.execute-api.us-east-1.amazonaws.com/v1/events"   # EventsEndpoint output of server/ (gitaquotes-analytics stack)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.anjanarao.hinduwisdom
            CFBundleURLSchemes: [hinduwisdom]
    dependencies:
      - target: GitaWidget

  GitaWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anjanarao.hinduwisdom.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hindu Wisdom
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
